<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究所マップ</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1330; font-family: 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif; color: #e8f3ff; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 14px; background: #12214d; border-bottom: 2px solid #2ee6ff; }
  nav b { font-size: 17px; }
  .grp { display: flex; gap: 6px; align-items: center; }
  .grp > span { font-size: 12px; opacity: .7; margin-right: 2px; }
  button { font: inherit; font-weight: 700; font-size: 14px; padding: 6px 14px; border: 0; border-radius: 8px; background: #1d2f66; color: #e8f3ff; cursor: pointer; }
  button.on { background: #2ee6ff; color: #0a1330; }
  nav a { color: #ffd83a; font-weight: 700; font-size: 13px; text-decoration: none; margin-left: auto; }
  iframe { flex: 1; border: 0; width: 100%; background: #dfe5ec; }
</style>
</head>
<body>
<nav>
  <b>研究所マップ</b>
  <div class="grp"><span>階</span><button data-floor="1">1階</button><button data-floor="2">2階（サイボーグ改造室）</button></div>
  <div class="grp"><span>表示</span><button data-kind="sheet">平面図</button><button data-kind="3d">3Dマップ</button></div>
  <a id="open" target="_blank">別タブで開く ↗</a>
</nav>
<iframe id="f" title="map"></iframe>
<script>
  // 直接の移動先。#2-3d のようにハッシュで階と表示を指定できる
  const PAGES = { '1-sheet': '/mapsheet.html', '1-3d': '/map.html', '2-sheet': '/mapsheet2.html', '2-3d': '/map.html?floor=2' };
  let floor = '1', kind = 'sheet';
  const m = /^#([12])-(sheet|3d)$/.exec(location.hash);
  if (m) { floor = m[1]; kind = m[2]; }
  function show() {
    const url = PAGES[floor + '-' + kind];
    document.getElementById('f').src = url;
    document.getElementById('open').href = url;
    document.querySelectorAll('[data-floor]').forEach((b) => b.classList.toggle('on', b.dataset.floor === floor));
    document.querySelectorAll('[data-kind]').forEach((b) => b.classList.toggle('on', b.dataset.kind === kind));
    history.replaceState(null, '', '#' + floor + '-' + kind);
  }
  document.querySelectorAll('[data-floor]').forEach((b) => b.onclick = () => { floor = b.dataset.floor; show(); });
  document.querySelectorAll('[data-kind]').forEach((b) => b.onclick = () => { kind = b.dataset.kind; show(); });
  show();
</script>
</body>
</html>
