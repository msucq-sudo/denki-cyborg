<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>敵図鑑</title>
<link rel="stylesheet" href="/src/tools/bestiary.css" />
</head>
<body>
<header><h1>敵図鑑 <small>ENEMY BESTIARY</small></h1><span class="hint">←/→ で切替 ・ ドラッグで回転 ・ ホイールでズーム</span></header>
<main>
  <nav id="list"></nav>
  <section id="stage">
    <div id="view"></div>
    <div id="labels"></div>
    <div id="msg" hidden>モデル準備中</div>
    <div id="toggles">
      <label><input type="checkbox" id="t-weak"> 弱点を強調</label>
      <label><input type="checkbox" id="t-hit"> 当たり判定</label>
      <label><input type="checkbox" id="t-tele"> 攻撃予告色</label>
      <label><input type="checkbox" id="t-rot" checked> 自動回転</label>
      <button id="b-lineup">全員並べる</button>
    </div>
  </section>
  <aside id="card"></aside>
</main>
<script type="module" src="/src/tools/bestiary.ts"></script>
</body>
</html>
